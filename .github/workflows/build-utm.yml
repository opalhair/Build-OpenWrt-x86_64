name: Build ImmortalWrt for UTM (OrbStack)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout local repository
        uses: actions/checkout@v5

      - name: Initialize compilation environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get update
          sudo -E apt-get install $(curl -fsSL https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/scripts/mk-ubuntu-docker-build-dependencies.sh)
          sudo -E apt-get autoremove --purge -y
          sudo -E apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL immortalwrt

      - name: Load custom feeds (diy-part1)
        run: |
          if [ -f diy-part1.sh ]; then
            chmod +x diy-part1.sh
            cd immortalwrt
            "$GITHUB_WORKSPACE/diy-part1.sh"
          fi

      - name: Update and Install feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration and run diy-part2
        run: |
          [ -f .config ] && cp .config immortalwrt/.config
          chmod +x diy-part2.sh
          cd immortalwrt
          BUILD_TARGET=UTM DEFAULT_IP=192.168.3.9 IPTV_PROFILE=NONE \
            REPLACE_GOLANG=1 INJECT_CLASH_META=1 \
            "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Generate build configuration & Download packages
        working-directory: ./immortalwrt
        run: |
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        working-directory: ./immortalwrt
        run: |
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Collect squashfs firmware files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          FIRM_DIR="immortalwrt/bin/targets/x86/64"
          RELEASE_DIR="release_files"
          mkdir -p "$RELEASE_DIR"
          shopt -s nullglob

          for f in \
            "$FIRM_DIR"/*squashfs-combined-efi.img.gz \
            "$FIRM_DIR"/*squashfs-combined.img.gz
          do
            cp "$f" "$RELEASE_DIR"/
          done

          ls -lh "$RELEASE_DIR"/
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          cat > release.txt << 'EOF'
          🎉 ImmortalWrt x86_64 固件（UTM / OrbStack 版）

          包含文件：
          • squashfs-combined-efi  → UEFI 启动（UTM / 新主板）
          • squashfs-combined      → Legacy BIOS 启动（旧主板 / J1900）

          默认管理 IP：192.168.3.9
          EOF
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ImmortalWrt ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.RELEASE_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 3

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
